name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate Python router syntax
        run: python3 -m py_compile scripts/model-router.py
      - name: Validate Cloudflare Worker syntax
        run: node --check worker/index.js
